<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Libros</title>
    <!-- Tipografías de la guía de estilo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #2B1B17;
            margin: 0;
            padding: 25px 20px;
            min-height: 100vh;
            box-sizing: border-box;
            
            /* Foto de la Escuela/Biblioteca de fondo */
            background-color: #FAF7F2;
            background-image: linear-gradient(rgba(43, 27, 23, 0.45), rgba(91, 15, 26, 0.55)), 
                              url("imags-icons/fondo.jpg"), 
                              url("imags-icons/fondo.jpeg"), 
                              url("imagenes/fondo.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .container {
            max-width: 1050px;
            margin: auto;
            background-color: rgba(255, 255, 255, 0.96);
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #EAD8C7;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .search-filters {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .search-filters input {
            width: 320px;
            padding: 10px 14px;
            border: 1px solid #D6C7B8;
            border-radius: 6px;
            background-color: #FDFBF8;
            font-family: 'Inter', sans-serif;
            color: #2B1B17;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-filters input:focus {
            border-color: #5B0F1A;
            box-shadow: 0 0 0 3px rgba(91, 15, 26, 0.12);
        }
        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #F0E6DA;
            color: #4A3E39;
            border: 1px solid #E2D2C2;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.88em;
            font-weight: 600;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .filter-btn.active {
            color: #FFFFFF !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        /* Colores específicos según categoría */
        .filter-btn[data-filter="Todos"].active { background-color: #5B0F1A; }
        .filter-btn[data-filter="Mat"] { border-color: #E67E22; }
        .filter-btn[data-filter="Mat"].active { background-color: #E67E22; }
        .filter-btn[data-filter="Len"] { border-color: #D4AF37; }
        .filter-btn[data-filter="Len"].active { background-color: #D4AF37; color: #2B1B17 !important; }
        .filter-btn[data-filter="Ing"] { border-color: #8E44AD; }
        .filter-btn[data-filter="Ing"].active { background-color: #8E44AD; }
        .filter-btn[data-filter="His"] { border-color: #6A2FA3; }
        .filter-btn[data-filter="His"].active { background-color: #6A2FA3; }
        .filter-btn[data-filter="Cie"] { border-color: #C0392B; }
        .filter-btn[data-filter="Cie"].active { background-color: #C0392B; }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #EAD8C7;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #F0E6DA;
        }
        th {
            background-color: #5B0F1A;
            color: #FFFFFF;
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.5px;
            font-size: 0.9em;
            text-transform: uppercase;
        }
        tbody tr:hover {
            background-color: #FDF8F3;
        }

        /* Etiquetas de materia */
        .materia-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.82em;
            text-align: center;
            color: #FFFFFF;
        }
        .materia-tag.mat { background-color: #E67E22; }
        .materia-tag.len { background-color: #D4AF37; color: #2B1B17; }
        .materia-tag.ing { background-color: #8E44AD; }
        .materia-tag.his { background-color: #6A2FA3; }
        .materia-tag.cie { background-color: #C0392B; }

        .stars {
            color: #D4AF37;
            font-size: 1.15em;
        }
        .status-disp, .status-uso, .status-desuso,
        .condicion-exc, .condicion-bue, .condicion-reg {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
            display: inline-block;
        }
        .status-disp { background-color: #D4AF37; color: #2B1B17; }
        .status-uso { background-color: #E67E22; color: #FFFFFF; }
        .status-desuso { background-color: #7A1F29; color: #FFFFFF; }
        
        .condicion-exc { background-color: #2E7D32; color: #FFFFFF; }
        .condicion-bue { background-color: #D4AF37; color: #2B1B17; }
        .condicion-reg { background-color: #7A1F29; color: #FFFFFF; }
        
        .online-yes { color: #2E7D32; font-size: 1.3em; font-weight: bold; }
        .online-no { color: #C0392B; font-size: 1.3em; font-weight: bold; }
        .popular-yes { color: #D35400; font-size: 1.3em; }
        .popular-no { color: #C5B8AC; font-size: 1.3em; }
        
        .leyenda {
            margin-top: 25px;
            padding: 16px 20px;
            background-color: #F8F3EC;
            border: 1px solid #EAD8C7;
            border-radius: 8px;
        }
        .leyenda h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-family: 'Playfair Display', serif;
            color: #5B0F1A;
            font-size: 1.15em;
        }
        .leyenda p {
            margin: 0;
            color: #4A3E39;
            font-size: 0.9em;
            line-height: 1.6;
        }
        .next-btn {
            display: block;
            width: 200px;
            margin: 25px auto;
            text-align: center;
            background-color: #5B0F1A;
            color: #FFFFFF;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.35);
        }
        .next-btn:hover {
            background-color: #7A1F29;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="search-filters">
            <input type="text" id="searchInput" placeholder="Buscar por título o materia...">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="Todos">Todos</button>
                <button class="filter-btn" data-filter="Mat">Matemática</button>
                <button class="filter-btn" data-filter="Len">Lengua</button>
                <button class="filter-btn" data-filter="Ing">Inglés</button>
                <button class="filter-btn" data-filter="His">Historia</button>
                <button class="filter-btn" data-filter="Cie">Ciencias</button>
            </div>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Materia</th>
                        <th>Calif.</th>
                        <th>Estado</th>
                        <th>Condición</th>
                        <th>Cant.</th>
                        <th>Online</th>
                        <th>Pop.</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody">
                </tbody>
            </table>
        </div>
        
        <div class="leyenda">
            <h3>Leyenda de Materias y Estados:</h3>
            <p>
                <span class="materia-tag mat">Mat</span> Matemática |
                <span class="materia-tag len">Len</span> Lengua |
                <span class="materia-tag ing">Ing</span> Inglés |
                <span class="materia-tag his">His</span> Historia |
                <span class="materia-tag cie">Cie</span> Ciencias
            </p>
            <p style="margin-top: 8px;">
                <span class="status-disp">Disp</span>=Disponible |
                <span class="status-uso">Uso</span>=En uso |
                <span class="status-desuso">Desuso</span> |
                <span class="popular-yes">🔥</span>=Popular |
                <span class="condicion-exc">Exc</span>=Excelente |
                <span class="condicion-bue">Bue</span>=Buena |
                <span class="condicion-reg">Reg</span>=Regular
            </p>
        </div>
    </div>
    
    <a href="buscar_libros_alumno.html" class="next-btn">Siguiente</a>

    <script>
        const booksData = [
            { titulo: 'Álgebra Lineal', autor: 'González', materia: 'Mat', calificacion: 4.5, estado: 'Disp', condicion: 'Exc', cant: 15, online: true, popular: true },
            { titulo: 'Literatura Esp. XX', autor: 'Ruiz', materia: 'Len', calificacion: 4.8, estado: 'Uso', condicion: 'Bue', cant: 8, online: true, popular: true },
            { titulo: 'English Grammar', autor: 'Murphy', materia: 'Ing', calificacion: 4.7, estado: 'Disp', condicion: 'Exc', cant: 12, online: false, popular: false },
            { titulo: 'Historia Universal', autor: 'Martinez', materia: 'His', calificacion: 4.3, estado: 'Disp', condicion: 'Reg', cant: 6, online: false, popular: false },
            { titulo: 'Cálculo Diferencial', autor: 'Silva', materia: 'Mat', calificacion: 4.2, estado: 'Des', condicion: 'Reg', cant: 3, online: false, popular: false },
            { titulo: 'Biología Molecular', autor: 'Fernández', materia: 'Cie', calificacion: 4.6, estado: 'Disp', condicion: 'Exc', cant: 10, online: true, popular: true },
            { titulo: 'Gramática Española', autor: 'Jiménez', materia: 'Len', calificacion: 4.1, estado: 'Disp', condicion: 'Bue', cant: 7, online: false, popular: false },
            { titulo: 'English Conversation', autor: 'Johnson', materia: 'Ing', calificacion: 4.4, estado: 'Uso', condicion: 'Exc', cant: 5, online: true, popular: true },
            { titulo: 'Física Clásica', autor: 'Pérez', materia: 'Cie', calificacion: 4.0, estado: 'Disp', condicion: 'Exc', cant: 9, online: true, popular: false },
            { titulo: 'Química Orgánica', autor: 'López', materia: 'Cie', calificacion: 4.5, estado: 'Uso', condicion: 'Bue', cant: 4, online: true, popular: true },
            { titulo: 'Cien Años de Soledad', autor: 'García Márquez', materia: 'Len', calificacion: 4.9, estado: 'Disp', condicion: 'Exc', cant: 18, online: true, popular: true },
            { titulo: 'Economía Básica', autor: 'Díaz', materia: 'His', calificacion: 3.9, estado: 'Disp', condicion: 'Reg', cant: 10, online: false, popular: false },
            { titulo: 'Geometría Analítica', autor: 'Torres', materia: 'Mat', calificacion: 4.1, estado: 'Disp', condicion: 'Bue', cant: 11, online: false, popular: false },
            { titulo: 'Redacción Creativa', autor: 'Ramírez', materia: 'Len', calificacion: 4.6, estado: 'Disp', condicion: 'Exc', cant: 13, online: true, popular: true },
            { titulo: 'World History', autor: 'Jones', materia: 'His', calificacion: 4.5, estado: 'Uso', condicion: 'Bue', cant: 6, online: true, popular: false },
            { titulo: 'Trigonometría', autor: 'Sánchez', materia: 'Mat', calificacion: 4.0, estado: 'Disp', condicion: 'Bue', cant: 14, online: false, popular: false },
            { titulo: 'Programación en Python', autor: 'Gómez', materia: 'Cie', calificacion: 4.9, estado: 'Disp', condicion: 'Exc', cant: 20, online: true, popular: true },
            { titulo: 'Gramática Inglesa Avanzada', autor: 'Davis', materia: 'Ing', calificacion: 4.3, estado: 'Disp', condicion: 'Exc', cant: 8, online: true, popular: false },
            { titulo: 'Poesía del Siglo XX', autor: 'Vargas', materia: 'Len', calificacion: 4.7, estado: 'Uso', condicion: 'Bue', cant: 5, online: false, popular: false },
            { titulo: 'Álgebra Abstracta', autor: 'Fernández', materia: 'Mat', calificacion: 4.6, estado: 'Disp', condicion: 'Exc', cant: 9, online: false, popular: false },
            { titulo: 'Historia Moderna', autor: 'Cruz', materia: 'His', calificacion: 4.4, estado: 'Disp', condicion: 'Bue', cant: 7, online: true, popular: false },
            { titulo: 'Cálculo Avanzado', autor: 'Rojas', materia: 'Mat', calificacion: 4.8, estado: 'Uso', condicion: 'Exc', cant: 4, online: true, popular: true },
            { titulo: 'Principios de Física', autor: 'Vega', materia: 'Cie', calificacion: 4.1, estado: 'Disp', condicion: 'Reg', cant: 11, online: false, popular: false },
            { titulo: 'Novela Histórica', autor: 'Mendoza', materia: 'His', calificacion: 4.5, estado: 'Disp', condicion: 'Bue', cant: 10, online: true, popular: true },
        ];

        const searchInput = document.getElementById('searchInput');
        const inventoryBody = document.getElementById('inventoryBody');
        const filterButtons = document.querySelectorAll('.filter-btn');

        function renderTable(books) {
            inventoryBody.innerHTML = '';
            books.forEach(book => {
                const row = document.createElement('tr');
                const stars = '★'.repeat(Math.floor(book.calificacion)) + (book.calificacion % 1 !== 0 ? '½' : '') + '☆'.repeat(5 - Math.ceil(book.calificacion));
                const materiaClass = book.materia.toLowerCase();
                
                row.innerHTML = `
                    <td>${book.titulo}</td>
                    <td>${book.autor}</td>
                    <td><span class="materia-tag ${materiaClass}">${book.materia}</span></td>
                    <td><span class="stars">${stars}</span><br>${book.calificacion}</td>
                    <td><span class="status-${book.estado.toLowerCase()}">${book.estado}</span></td>
                    <td><span class="condicion-${book.condicion.toLowerCase()}">${book.condicion}</span></td>
                    <td>${book.cant}</td>
                    <td class="${book.online ? 'online-yes' : 'online-no'}">${book.online ? '&#10004;' : '&#10006;'}</td>
                    <td class="${book.popular ? 'popular-yes' : 'popular-no'}">🔥</td>
                `;
                inventoryBody.appendChild(row);
            });
        }

        function handleFilterAndSearch() {
            const searchTerm = searchInput.value.toLowerCase();
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;

            let filteredBooks = booksData;

            if (activeFilter !== 'Todos') {
                filteredBooks = filteredBooks.filter(book => book.materia === activeFilter);
            }

            if (searchTerm) {
                filteredBooks = filteredBooks.filter(book =>
                    book.titulo.toLowerCase().includes(searchTerm) ||
                    book.autor.toLowerCase().includes(searchTerm) ||
                    book.materia.toLowerCase().includes(searchTerm)
                );
            }

            renderTable(filteredBooks);
        }

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                handleFilterAndSearch();
            });
        });

        searchInput.addEventListener('keyup', handleFilterAndSearch);

        document.addEventListener('DOMContentLoaded', () => {
            renderTable(booksData);
        });
    </script>
</body>
</html>
