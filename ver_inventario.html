<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Libros</title>
    <!-- Tipografías de la guía de estilo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #2B1B17;
            padding: 0;
            margin: 0;
            min-height: 100vh;
            
            /* Foto de la Escuela/Biblioteca de fondo */
            background-color: #FAF7F2;
            background-image: linear-gradient(rgba(43, 27, 23, 0.45), rgba(91, 15, 26, 0.55)), 
                              url("imags-icons/fondo.jpg"), 
                              url("imags-icons/fondo.jpeg"), 
                              url("imagenes/fondo.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .navbar {
            background-color: #0c0fd6;
            padding: 14px 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 1.6em;
            color: #FFFFFF;
            letter-spacing: 0.5px;
        }
        .navbar .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar .search-box input {
            padding: 8px 14px;
            border: 1px solid #EAD8C7;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF;
        }
        .navbar .settings-btn {
            padding: 8px 12px;
            background-color: rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .navbar .settings-btn:hover {
            background-color: rgba(255, 255, 255, 0.28);
        }
        .dropdown-menu {
            position: absolute;
            top: 60px;
            right: 20px;
            background-color: #FFFFFF;
            border: 1px solid #EAD8C7;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(91, 15, 26, 0.2);
            z-index: 1000;
            display: none;
            overflow: hidden;
        }
        .dropdown-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .dropdown-menu ul li a {
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            color: #3A2A28;
            transition: background-color 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95em;
        }
        .dropdown-menu ul li a:hover {
            background-color: #F8F3EC;
            color: #5B0F1A;
        }
        .container {
            max-width: 1260px;
            margin: 30px auto;
            background-color: rgba(248, 248, 248, 0.96);
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #EAD8C7;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .inventario-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            border-bottom: 2px solid #F3EAE0;
            padding-bottom: 12px;
        }
        .inventario-header h2 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            color: #5B0F1A;
            font-size: 1.8em;
            letter-spacing: 0.5px;
        }
        .inventario-header .btn-add {
            background-color: #5B0F1A;
            color: rgb(248, 248, 248);
            border: none;
            padding: 11px 22px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.2s, transform 0.1s;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(91, 15, 26, 0.25);
        }
        .inventario-header .btn-add:hover {
            background-color: #7A1F29;
            transform: translateY(-1px);
        }
        .inventario-table {
            width: 100%;
            border-collapse: collapse;
        }
        .inventario-table th, .inventario-table td {
            padding: 12px 14px;
            border: 1px solid #F0E6DA;
            text-align: left;
        }
        .inventario-table th {
            background-color: #5B0F1A;
            color: #f8f8f8;
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.5px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .inventario-table tr:nth-child(even) {
            background-color: #FDFBF8;
        }
        .inventario-table tr:hover {
            background-color: #FAF2EB;
        }
        .inventario-table td strong {
            display: block;
        }
        .inventario-table td.id-unico, .inventario-table td.precio {
            font-weight: bold;
        }
        .inventario-table td.id-unico {
            color: #5B0F1A;
        }
        .inventario-table td.precio {
            color: #2E7D32;
        }
        .inventario-table th:first-child, .inventario-table td:first-child {
            width: 50px;
            text-align: center;
        }
        .btn-edit, .btn-delete {
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.88em;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            margin: 0 2px;
            transition: all 0.2s ease;
        }
        .btn-edit {
            background-color: #D4AF37;
            color: #2B1B17;
        }
        .btn-edit:hover {
            background-color: #C29E2E;
        }
        .btn-delete {
            background-color: #7A1F29;
        }
        .btn-delete:hover {
            background-color: #5B0F1A;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>SMARTBOOKS</h1>
        <div class="search-box">
            <button class="settings-btn" id="settingsBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-settings"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 4.22 18.2l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82z"></path></svg>
            </button>
        </div>
        <div class="dropdown-menu" id="dropdownMenu">
            <ul>
                <li><a href="director.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-home"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Inicio
                </a></li>
                <li><a href="gestion_pedidos.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-list"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    Libros Requeridos
                </a></li>
                <li><a href="ver_inventario.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-book"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V6.5A2.5 2.5 0 0 0 17.5 4H4a2.5 2.5 0 0 0-2.5 2.5v10A2.5 2.5 0 0 0 4 19.5z"></path></svg>
                    Ver Inventario
                </a></li>
                <li style="border-top: 1px solid #EAD8C7;"><a href="index.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-log-out"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Cerrar Sesión
                </a></li>
            </ul>
        </div>
    </div>

    <div class="container">
        <div class="inventario-header">
            <h2>Inventario de Libros</h2>
            <button class="btn-add" id="addBookBtn">Agregar Nuevo Libro</button>
        </div>
        
        <table class="inventario-table">
            <thead>
                <tr>
                    <th>N° Libro</th>
                    <th>Fecha Ingreso</th>
                    <th>Título del Libro</th>
                    <th>Autor (Apellido/Nombre)</th>
                    <th>Editorial</th>
                    <th>Lugar</th>
                    <th>Año</th>
                    <th>Págs</th>
                    <th>Cant</th>
                    <th>Tamaño</th>
                    <th>N° de Inventario</th>
                    <th>ISBN</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="inventory-body">
            </tbody>
        </table>
    </div>

    <script>
        const settingsBtn = document.getElementById('settingsBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const inventoryBody = document.getElementById('inventory-body');
        const addBookBtn = document.getElementById('addBookBtn');

        const initialBooks = [
            { id: 'ESC-001-24', noLibro: '001', fecha: '15/03/2024', titulo: 'Cien Años de Soledad', autor: 'García Márquez, Gabriel', editorial: 'Sudamericana', lugar: 'Buenos Aires', anio: '1967', pags: '471', cant: '3', tamano: '23x15cm', precio: '$25.50' },
            { id: 'ESC-002-24', noLibro: '002', fecha: '20/03/2024', titulo: 'Don Quijote de la Mancha', autor: 'Cervantes, Miguel de', editorial: 'Planeta', lugar: 'Barcelona', anio: '1605', pags: '863', cant: '2', tamano: '24x16cm', precio: '$32.00' },
            { id: 'ESC-003-24', noLibro: '003', fecha: '22/03/2024', titulo: 'El Principito', autor: 'Saint-Exupéry, Antoine de', editorial: 'Salamandra', lugar: 'Madrid', anio: '1943', pags: '96', cant: '5', tamano: '20x13cm', precio: '$18.75' },
            { id: 'ESC-004-24', noLibro: '004', fecha: '25/03/2024', titulo: 'Rayuela', autor: 'Cortázar, Julio', editorial: 'Alfaguara', lugar: 'México DF', anio: '1963', pags: '635', cant: '2', tamano: '23x15cm', precio: '$28.90' },
            { id: 'ESC-005-24', noLibro: '005', fecha: '28/03/2024', titulo: 'La Casa de los Espíritus', autor: 'Allende, Isabel', editorial: 'Plaza & Janés', lugar: 'Barcelona', anio: '1982', pags: '448', cant: '4', tamano: '22x14cm', precio: '$24.80' },
            { id: 'ESC-006-24', noLibro: '006', fecha: '30/03/2024', titulo: 'Ficciones', autor: 'Borges, Jorge Luis', editorial: 'Emecé', lugar: 'Buenos Aires', anio: '1944', pags: '174', cant: '3', tamano: '21x13cm', precio: '$19.80' },
            { id: 'ESC-007-24', noLibro: '007', fecha: '05/04/2024', titulo: 'Pedro Páramo', autor: 'Rulfo, Juan', editorial: 'Fondo de Cultura', lugar: 'México DF', anio: '1955', pags: '124', cant: '6', tamano: '19x12cm', precio: '$16.40' },
            { id: 'ESC-008-24', noLibro: '008', fecha: '05/04/2024', titulo: 'La Tregua', autor: 'Benedetti, Mario', editorial: 'Seix Barral', lugar: 'Barcelona', anio: '1960', pags: '192', cant: '2', tamano: '20x13cm', precio: '$21.30' },
            { id: 'ESC-009-24', noLibro: '009', fecha: '08/04/2024', titulo: 'Martin Fierro', autor: 'Hernández, José', editorial: 'Losada', lugar: 'Buenos Aires', anio: '1872', pags: '208', cant: '4', tamano: '21x14cm', precio: '$22.15' },
            { id: 'ESC-010-24', noLibro: '010', fecha: '10/04/2024', titulo: 'El Túnel', autor: 'Sábato, Ernesto', editorial: 'Seix Barral', lugar: 'Buenos Aires', anio: '1948', pags: '158', cant: '3', tamano: '20x13cm', precio: '$19.95' }
        ];

        function loadBooks() {
            const storedBooks = localStorage.getItem('books');
            if (storedBooks) {
                return JSON.parse(storedBooks);
            }
            localStorage.setItem('books', JSON.stringify(initialBooks));
            return initialBooks;
        }

        function saveBooks(books) {
            localStorage.setItem('books', JSON.stringify(books));
        }

        function renderTable() {
            const books = loadBooks();
            inventoryBody.innerHTML = '';
            books.forEach(book => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${book.noLibro}</td>
                    <td>${book.fecha}</td>
                    <td>${book.titulo}</td>
                    <td>${book.autor}</td>
                    <td>${book.editorial}</td>
                    <td>${book.lugar}</td>
                    <td>${book.anio}</td>
                    <td>${book.pags}</td>
                    <td>${book.cant}</td>
                    <td>${book.tamano}</td>
                    <td class="precio">${book.precio}</td>
                    <td class="id-unico">${book.id}</td>
                    <td>
                        <button class="btn-edit" onclick="editarLibro('${book.id}')">Editar</button>
                        <button class="btn-delete" onclick="eliminarLibro('${book.id}')">Eliminar</button>
                    </td>
                `;
                inventoryBody.appendChild(row);
            });
        }

        function editarLibro(libroID) {
            window.location.href = `agregar_libro.html?id=${libroID}`;
        }
        
        function eliminarLibro(libroID) {
            if (confirm('¿Estás seguro de que quieres eliminar este libro? Esta acción no se puede deshacer.')) {
                let books = loadBooks();
                books = books.filter(book => book.id !== libroID);
                saveBooks(books);
                renderTable();
            }
        }

        addBookBtn.addEventListener('click', () => {
            window.location.href = `agregar_libro.html`;
        });

        settingsBtn.addEventListener('click', () => {
            dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
        });

        window.addEventListener('click', (e) => {
            if (!settingsBtn.contains(e.target) && !dropdownMenu.contains(e.target) && dropdownMenu.style.display === 'block') {
                dropdownMenu.style.display = 'none';
            }
        });

        document.addEventListener('DOMContentLoaded', renderTable);
    </script>
</body>
</html>
